name: Update canvas

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: canvas

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CANVAS_RESULTS: ${{ runner.temp }}/canvas-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/update-canvas.mjs apply
      - run: npm run build
      - name: Commit the updated canvas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas assets README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update canvas"
            git push
          fi
      - run: node scripts/update-canvas.mjs respond
