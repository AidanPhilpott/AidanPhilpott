name: Reset canvas

# Runs weekly. Repo owners can also run it from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/update-canvas.mjs reset
      - run: npm run build
      - name: Commit the reset canvas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas assets README.md
          if ! git diff --cached --quiet; then
            git commit -m "Reset canvas"
            git push
          fi
