name: Reset canvas

# Runs weekly. Repo owners can also run it from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas-reset

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: bash scripts/publish.sh reset "Reset canvas"
