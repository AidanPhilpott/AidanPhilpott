name: Place a tile
description: Add a tile to Aidan's Canvas.
title: "Place a tile"
labels: [tile]
body:
  - type: markdown
    attributes:
      value: |
        ![Map of the canvas with row letters and column numbers](https://github.com/AidanPhilpott/AidanPhilpott/blob/main/assets/canvas-map.svg?raw=true)

        Choose a spot and a shade. You can place up to 3 tiles a day, one per submission. New tiles appear daily, and the canvas resets weekly.

        Aidan takes no responsibility for what is drawn here.
  - type: dropdown
    id: row
    attributes:
      label: Row
      options:
        - "A"
        - "B"
        - "C"
        - "D"
        - "E"
        - "F"
        - "G"
        - "H"
        - "I"
        - "J"
        - "K"
        - "L"
        - "M"
    validations:
      required: true
  - type: dropdown
