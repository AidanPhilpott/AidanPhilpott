name: Place a tile
description: Add up to 3 tiles to Aidan's Canvas.
title: "Place a tile"
labels: [tile]
body:
  - type: markdown
    attributes:
      value: |
        Your tiles are ready. Select **Create** and they will appear on the canvas in about a minute.

        Want to change them? [Go back to the canvas](https://aidanphilpott.github.io/AidanPhilpott/). Aidan takes no responsibility for what is drawn here.
  - type: input
    id: moves
    attributes:
      label: Tiles
      description: Filled in by the canvas.
      placeholder: "C12:Strong, D12:Soft"
    validations:
      required: true
